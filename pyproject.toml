[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwkit-mcp"
version = "0.1.0"
description = "MCP server for headless Power BI packaging / validation / rendering, non-intrusive Windows screenshots, and Office document conversion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hwkit contributors" }]
keywords = ["mcp", "powerbi", "pbix", "pbip", "tdml", "screenshot", "windows", "office"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hwkit-mcp = "hwkit_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwkit_mcp = ["py.typed"]
